[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "rustures"
version = "0.2.0"
description = "Offline change-point detection for Python, powered by Rust"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
]
readme = "README.md"

[project.urls]
Homepage = "https://denrew88.github.io/rustures/"
Documentation = "https://denrew88.github.io/rustures/"
Repository = "https://github.com/denrew88/rustures"
Issues = "https://github.com/denrew88/rustures/issues"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "rustures._rustures"
python-source = "python"
strip = true
