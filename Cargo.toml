[package]
name = "rustures"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Offline change-point detection for Python, powered by Rust"

[lib]
name = "_rustures"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }
thiserror = "2.0.20"

