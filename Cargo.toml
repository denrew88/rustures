[package]
name = "rustures"
version = "0.1.1"
edition = "2021"
rust-version = "1.83"
description = "Offline change-point detection for Python, powered by Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/denrew88/rustures"

[lib]
name = "_rustures"
crate-type = ["cdylib", "rlib"]

[features]
default = []
panic-test-hook = []

[dependencies]
nalgebra = "0.33.2"
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }
thiserror = "2.0.20"

[profile.release]
panic = "unwind"

[[bench]]
name = "cost_l2"
harness = false

[[bench]]
name = "dynp"
harness = false

[[bench]]
name = "pelt"
harness = false
